services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./deploy/postgres-low-spec.conf:/etc/postgresql/postgresql.conf:ro
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"

  polaris-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      WEB_CONCURRENCY: "1"
      POLARIS_INGEST_BATCH_SIZE: "500"
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
    depends_on:
      - polaris-server
