version: "2.7.0"
rules:
  - id: "go:GO-SEC-001"
    language: "go"
    severity: "CRITICAL"
    confidence: "HIGH"
    cwe: "CWE-89"
    pattern: "db.Query($QUERY + $INPUT)"
    message: "SQL Injection via string concatenation in database/sql"
  - id: "kotlin:KT-SEC-001"
    language: "kotlin"
    severity: "CRITICAL"
    confidence: "HIGH"
    cwe: "CWE-89"
    pattern: "rawQuery($QUERY + $INPUT)"
    message: "SQL Injection in rawQuery"
  - id: "php:PHP-SEC-001"
    language: "php"
    severity: "BLOCKER"
    confidence: "HIGH"
    cwe: "CWE-94"
    pattern: "eval($_GET[$KEY])"
    message: "Remote Code Execution via eval($_GET)"
  - id: "tf:TF-SEC-001"
    language: "terraform"
    severity: "CRITICAL"
    confidence: "HIGH"
    cwe: "CWE-284"
    pattern: "0.0.0.0/0"
    message: "Ingress open to 0.0.0.0/0"
  - id: "k8s:K8S-SEC-001"
    language: "kubernetes"
    severity: "CRITICAL"
    confidence: "HIGH"
    cwe: "CWE-250"
    pattern: "privileged: true"
    message: "Container running in privileged mode"
  - id: "sh:SH-SEC-001"
    language: "shell"
    severity: "CRITICAL"
    confidence: "HIGH"
    cwe: "CWE-78"
    pattern: "curl $URL | bash"
    message: "Piping remote script directly into bash"
