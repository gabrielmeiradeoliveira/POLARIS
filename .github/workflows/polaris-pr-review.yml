name: POLARIS Pull Request Review (dry run)

on:
  workflow_call:
    inputs:
      base_revision:
        description: Optional base revision when invoked as a reusable workflow.
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event_name == 'workflow_call' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install POLARIS
        run: python -m pip install .
      - name: Analyze pull request (dry run)
        env:
          POLARIS_PROVIDER: fake
        run: polaris review --provider fake --base "${{ inputs.base_revision || github.event.pull_request.base.sha }}"
      - name: Execution summary
        if: always()
        run: |
          echo "## POLARIS PR review" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry-run is enforced by the integration default. No GitHub comments are published." >> "$GITHUB_STEP_SUMMARY"
