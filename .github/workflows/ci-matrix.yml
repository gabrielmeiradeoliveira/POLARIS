name: POLARIS CI Matrix (2.7.0)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-python-sql-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e . && pip install -r analyzers/python/requirements.txt && pip install -r analyzers/sql/requirements.txt
      - run: |
          python -m unittest tests/calibration/test_precision_calibration.py \
            tests/unit/scanner/test_monolith_safety.py \
            tests/performance/test_engine_benchmark.py \
            tests/performance/test_low_spec_envelope.py

  scanner-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd scanner-go && go test ./...
      - run: cd scanner-go && go build -o ../bin/polaris-scanner ./cmd/polaris-scanner
      - run: cd scanner-go && GOOS=windows GOARCH=amd64 go build -o ../bin/polaris-scanner.exe ./cmd/polaris-scanner
      - run: python -m unittest tests/integration/test_go_python_parity.py

  workers-dotnet-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: dotnet --info && java -version

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix web ci && npm --prefix web run build
