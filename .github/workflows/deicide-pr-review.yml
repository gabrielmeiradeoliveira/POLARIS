name: DEICIDE Pull Request Review (dry run)

on:
  workflow_call:
    inputs:
      publish:
        description: Explicitly permit publication after a trusted future runner integration is installed.
        required: false
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event_name == 'workflow_call' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DEICIDE
        run: python -m pip install .
      - name: Analyze pull request (dry run)
        env:
          DEICIDE_PROVIDER: fake
        run: deicide review --provider fake --base-revision "${{ github.event.pull_request.base.sha }}"
      - name: Execution summary
        if: always()
        run: |
          echo "## DEICIDE PR review" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry-run is enforced by the integration default. No GitHub comments are published." >> "$GITHUB_STEP_SUMMARY"
