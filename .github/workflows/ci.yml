name: POLARIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r analyzers/python/requirements.txt -r analyzers/sql/requirements.txt fastapi==0.115.6 uvicorn==0.34.0 psycopg[binary]==3.2.3
      - name: Validate goals
        run: python scripts/validation/validate_goals.py
      - name: Run unit and contract tests
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest discover -s tests/contract -v
          python -m unittest discover -s tests/integration/scanner -v
