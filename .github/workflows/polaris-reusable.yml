name: POLARIS Reusable Security Scan

on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string

jobs:
  polaris-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run POLARIS Scanner (SARIF + SBOM)
        run: |
          PYTHONPATH=src python -m polaris_scanner.cli analyze \
            --target . \
            --project "${{ inputs.project-key }}" \
            --format sarif \
            --output polaris.sarif \
            --sbom-out sbom.cdx.json
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: polaris.sarif
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-sbom
          path: sbom.cdx.json
