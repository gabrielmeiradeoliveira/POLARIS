name: POLARIS Static Analysis
on: [push, pull_request]
jobs:
  polaris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m polaris_scanner.cli analyze --target src --project "${{ github.event.repository.name }}" --branch "${{ github.ref_name }}" --server "${{ secrets.POLARIS_URL }}" --output polaris-report.json
