services:
  postgres:
    image: postgres:17
    container_name: polaris-poc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polaris_poc}
      POSTGRES_USER: ${POSTGRES_USER:-polaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polaris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polaris} -d ${POSTGRES_DB:-polaris_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polaris_pgdata:
