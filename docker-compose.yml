services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-polaris}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - polaris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polaris} -d ${POSTGRES_DB:-polaris}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris_net

  server:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PG_DSN: postgresql://${POSTGRES_USER:-polaris}:${POSTGRES_PASSWORD:-polaris_dev_password}@postgres:5432/${POSTGRES_DB:-polaris}
      DATABASE_URL: postgresql://${POSTGRES_USER:-polaris}:${POSTGRES_PASSWORD:-polaris_dev_password}@postgres:5432/${POSTGRES_DB:-polaris}
      POLARIS_LOG_LEVEL: ${POLARIS_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - polaris_net

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - polaris_net

volumes:
  polaris_pgdata:

networks:
  polaris_net:
    driver: bridge
